<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>All-In Poker — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon-staff.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/gameday-apple-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(90deg, #8B0000, #d4af37, #8B0000);
      padding: 8px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 1.1rem; color: #fff; text-align: center; }
    .header .subtitle { color: #fff8; font-size: 0.72rem; text-align: center; }

    /* ── Controls bar ── */
    .controls-bar {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .controls-bar select {
      flex: 1;
      min-width: 180px;
      background: #222;
      border: 1px solid #444;
      color: #eee;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .venue-pills {
      display: flex;
      gap: 6px;
    }
    .venue-pill {
      padding: 7px 14px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      background: #222;
      color: #666;
      border: 1px solid #333;
    }
    .venue-pill.te.active  { background: rgba(68,221,68,0.15); color: #44dd44; border-color: #44dd44; }
    .venue-pill.wc.active  { background: rgba(192,132,252,0.15); color: #c084fc; border-color: #c084fc; }
    .refresh-btn {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .refresh-btn:active { background: #333; }
    .refresh-btn.spinning { color: #d4af37; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      padding: 8px 12px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
    }
    .stat { text-align: center; }
    .stat .num { font-size: 1.3rem; font-weight: bold; }
    .stat .num.green  { color: #44dd44; }
    .stat .num.yellow { color: #ffcc00; }
    .stat .num.red    { color: #ff4444; }
    .stat .num.grey   { color: #555; }
    .stat .lbl { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-game-tabs { display: flex; gap: 4px; justify-content: center; margin-bottom: 6px; }
    .stat-game-tab {
      padding: 3px 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: #666;
    }
    .stat-game-tab.active { background: #d4af37; color: #000; }

    /* ── Main grid ── */
    .main { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) { .row-2 { grid-template-columns: 1fr; } }

    /* ── Cards ── */
    .card {
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .card-title { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-title.green  { color: #44dd44; }
    .card-title.yellow { color: #ffcc00; }
    .card-title.orange { color: #ff9900; }
    .card-title.pink   { color: #ec4899; }
    .badge {
      background: #333;
      color: #eee;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge.green  { background: rgba(68,221,68,0.15);  color: #44dd44; }
    .badge.yellow { background: rgba(255,204,0,0.15);  color: #ffcc00; }
    .badge.orange { background: rgba(255,153,0,0.15);  color: #ff9900; }
    .badge.pink   { background: rgba(236,72,153,0.15); color: #ec4899; }

    /* ── Game tabs inside card ── */
    .game-tabs { display: flex; padding: 6px 8px; gap: 5px; }
    .game-tab {
      flex: 1;
      padding: 5px;
      border: none;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      background: #222;
      color: #666;
      font-weight: bold;
    }
    .game-tab.active { background: #d4af37; color: #000; }

    /* ── Player rows ── */
    .player-list { max-height: 260px; overflow-y: auto; padding: 0 8px 8px; }
    .player-row {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      border-radius: 5px;
      margin-bottom: 4px;
      font-size: 0.88rem;
      gap: 6px;
    }
    .player-row.ci    { background: rgba(68,221,68,0.08);  border-left: 3px solid #44dd44; cursor: pointer; }
    .player-row.ci:active { background: rgba(68,221,68,0.18); }
    .player-row.rsvp  { background: rgba(255,204,0,0.06);  border-left: 3px solid #ffcc00; cursor: pointer; }
    .player-row.rsvp:active { background: rgba(255,204,0,0.16); }
    .player-row.rsvp.arrived { opacity: 0.45; cursor: default; }
    .player-num  { color: #555; font-size: 0.75rem; min-width: 18px; }
    .player-name { flex: 1; }
    .player-hint { font-size: 0.7rem; color: #555; }
    .player-row.rsvp:not(.arrived):hover .player-hint { color: #44dd44; }
    .arrived-tag {
      font-size: 0.65rem;
      background: rgba(68,221,68,0.2);
      color: #44dd44;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .empty-state { text-align: center; padding: 24px 12px; color: #444; font-size: 0.85rem; font-style: italic; }

    /* ── Results section ── */
    .results-header {
      padding: 8px 12px 4px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      border-top: 1px solid #1e1e1e;
    }
    .elim-row {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 5px;
      margin-bottom: 3px;
      font-size: 0.87rem;
      gap: 8px;
      background: #131313;
    }
    .rank-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
      background: #222;
      color: #888;
      flex-shrink: 0;
    }
    .rank-badge.gold   { background: #d4af37; color: #000; }
    .rank-badge.silver { background: #aaa;    color: #000; }
    .rank-badge.bronze { background: #cd7f32; color: #000; }
    .pts-tag {
      font-size: 0.75rem;
      color: #d4af37;
      font-weight: bold;
      white-space: nowrap;
    }
    .bounty-tag {
      background: rgba(236,72,153,0.15);
      color: #ec4899;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* ── Last updated ── */
    .footer-bar {
      text-align: center;
      padding: 8px;
      font-size: 0.72rem;
      color: #444;
    }
    html.back-nav-on .header { padding-left: 60px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>♠ All-In Poker Dashboard</h1>
    <div class="subtitle" id="headerSub">Loading...</div>
  </div>

  <div class="controls-bar">
    <div class="venue-pills">
      <button class="venue-pill te active" onclick="selectVenue('Tight End')">Tight End</button>
      <button class="venue-pill wc" onclick="selectVenue('Wild Corgi')">Wild Corgi</button>
    </div>
    <select id="eventSelect" onchange="onEventChange()">
      <option>Loading schedule…</option>
    </select>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">↻ Refresh</button>
  </div>

  <!-- Stats bar with game toggle -->
  <div style="background:#0d0d0d; border-bottom:1px solid #222; padding: 6px 12px 0;">
    <div class="stat-game-tabs">
      <button class="stat-game-tab active" id="sgTab1" onclick="switchStatsGame(1)">Game 1</button>
      <button class="stat-game-tab" id="sgTab2" onclick="switchStatsGame(2)">Game 2</button>
    </div>
  </div>
  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="num green" id="statCI">--</div><div class="lbl">Checked In</div></div>
    <div class="stat"><div class="num yellow" id="statRSVP">--</div><div class="lbl">Pending RSVP</div></div>
    <div class="stat"><div class="num" style="color:#aaa;" id="statExpected">--</div><div class="lbl">Expected</div></div>
    <div class="stat"><div class="num grey" id="statElim">--</div><div class="lbl">Eliminated</div></div>
  </div>

  <div class="main">

    <!-- Check-ins + RSVPs -->
    <div class="row-2">

      <!-- Checked In -->
      <div class="card">
        <div class="card-header">
          <span class="card-title green">✓ Checked In</span>
          <span class="badge green" id="ciBadge">0</span>
        </div>
        <div class="game-tabs">
          <button class="game-tab active" id="ciTab1" onclick="switchCiTab(1)">Game 1 (<span id="ciG1Count">0</span>)</button>
          <button class="game-tab"        id="ciTab2" onclick="switchCiTab(2)">Game 2 (<span id="ciG2Count">0</span>)</button>
        </div>
        <div class="player-list" id="ciList">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

      <!-- RSVPs -->
      <div class="card">
        <div class="card-header">
          <span class="card-title yellow">● RSVPs</span>
          <span class="badge yellow" id="rsvpBadge">0</span>
        </div>
        <div class="game-tabs">
          <button class="game-tab active" id="rsvpTab1" onclick="switchRsvpTab(1)">Game 1 (<span id="rsvpG1Count">0</span>)</button>
          <button class="game-tab"        id="rsvpTab2" onclick="switchRsvpTab(2)">Game 2 (<span id="rsvpG2Count">0</span>)</button>
        </div>
        <div class="player-list" id="rsvpList">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

    </div>

    <!-- Results (eliminations + bounties) — shown whenever data exists -->
    <div class="row-2" id="resultsRow" style="display:none;">

      <!-- Eliminations -->
      <div class="card">
        <div class="card-header">
          <span class="card-title orange">🏆 Results</span>
          <span class="badge orange" id="elimBadge">0</span>
        </div>
        <div class="game-tabs">
          <button class="game-tab active" id="elimTab1" onclick="switchElimTab(1)">Game 1</button>
          <button class="game-tab"        id="elimTab2" onclick="switchElimTab(2)">Game 2</button>
        </div>
        <div class="player-list" id="elimList">
          <div class="empty-state">No eliminations yet</div>
        </div>
      </div>

      <!-- Bounties tonight -->
      <div class="card">
        <div class="card-header">
          <span class="card-title pink">🎯 Bounties Tonight</span>
          <span class="badge pink" id="bountyBadge">0</span>
        </div>
        <div class="game-tabs">
          <button class="game-tab active" id="bountyTab1" onclick="switchBountyTab(1)">Game 1</button>
          <button class="game-tab"        id="bountyTab2" onclick="switchBountyTab(2)">Game 2</button>
        </div>
        <div class="player-list" id="bountyList">
          <div class="empty-state">No bounties yet</div>
        </div>
      </div>

    </div>

  </div>

  <div class="footer-bar" id="footerBar">—</div>

<script type="module">
  import { PokerAPI } from './firebase-api.js?v=6';
  import { requireStaff } from './staff-auth.js';

  await requireStaff();

  const BONUS_POINTS = { 1:90, 2:85, 3:80, 4:70, 5:60, 6:50, 7:40, 8:30, 9:20, 10:10 };

  let currentVenue = 'Tight End';
  let currentDate  = null;   // M/D/YYYY format (from schedule)
  let dailyStats   = null;
  let scoring      = { 1: { eliminations:[], bounties:[] }, 2: { eliminations:[], bounties:[] } };
  let activeStatsGame = 1;
  let activeCiTab     = 1;
  let activeRsvpTab   = 1;
  let activeElimTab   = 1;
  let activeBountyTab = 1;
  let refreshTimer    = null;

  // ──────────────────────────────────────────────
  // Init
  // ──────────────────────────────────────────────
  loadSchedule();

  // ──────────────────────────────────────────────
  // Schedule dropdown (same approach as director.html)
  // ──────────────────────────────────────────────
  async function loadSchedule() {
    const sel = document.getElementById('eventSelect');
    sel.innerHTML = '<option>Loading…</option>';
    const withTimeout = (promise, ms, label) => new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(`${label} timed out`)), ms);
      promise.then(
        (value) => { clearTimeout(timer); resolve(value); },
        (error) => { clearTimeout(timer); reject(error); }
      );
    });
    try {
      const [upRes, histRes] = await Promise.allSettled([
        withTimeout(PokerAPI.getSchedule({ historical: false }), 8000, 'Upcoming schedule'),
        withTimeout(PokerAPI.getSchedule({ historical: true }), 8000, 'Historical schedule')
      ]);
      const upcoming   = upRes.status === 'fulfilled' ? (upRes.value.schedule || []) : [];
      const historical = histRes.status === 'fulfilled' ? (histRes.value.schedule || []) : [];

      if (upRes.status === 'rejected') {
        console.error('loadSchedule upcoming error:', upRes.reason);
      }
      if (histRes.status === 'rejected') {
        console.error('loadSchedule historical error:', histRes.reason);
      }

      const seen = new Set();
      const all  = [];
      upcoming.forEach(g => {
        const key = g.date + '|' + (g.location || g.venue);
        if (!seen.has(key)) { seen.add(key); all.push({ ...g, venue: g.location || g.venue, isPast: false }); }
      });
      [...historical].reverse().forEach(g => {
        const key = g.date + '|' + (g.venue || g.location);
        if (!seen.has(key)) { seen.add(key); all.push({ ...g, venue: g.venue || g.location, isPast: true }); }
      });
      all.sort((a,b) => new Date(b.date) - new Date(a.date));

      sel.innerHTML = '';
      if (all.length === 0) { sel.innerHTML = '<option>No games found</option>'; return; }

      const todayStr = new Date().toLocaleDateString();
      let autoIdx = 0;

      all.forEach((g, i) => {
        const opt = document.createElement('option');
        opt.value = g.date + '|' + g.venue;
        let label = `${g.date}  —  ${g.venue}`;
        if (g.type && g.type !== 'Regular') label += `  (${g.type})`;
        if (g.isPast) label = `↩ ${label}`;
        opt.textContent = label;
        sel.appendChild(opt);
        if (datesMatch(g.date, todayStr) && g.venue === currentVenue) autoIdx = i;
      });

      sel.selectedIndex = autoIdx;
      applyEventSelection();
    } catch (e) {
      console.error('loadSchedule error:', e);
      sel.innerHTML = '<option>Error loading schedule</option>';
    }
  }

  function datesMatch(d1, d2) {
    const n = s => String(s).replace(/\b0/g,'').trim();
    return n(d1) === n(d2) || n(d1).includes(n(d2)) || n(d2).includes(n(d1));
  }

  function applyEventSelection() {
    const val = document.getElementById('eventSelect').value;
    if (!val || val.startsWith('Loading') || val.startsWith('Error') || val.startsWith('No games')) return;
    const [date, venue] = val.split('|');
    currentDate  = date;
    // auto-switch venue pill if different
    if (venue && venue !== currentVenue) {
      currentVenue = venue;
      document.querySelectorAll('.venue-pill').forEach(b => b.classList.remove('active'));
      const slug = venue === 'Tight End' ? 'te' : 'wc';
      document.querySelector(`.venue-pill.${slug}`)?.classList.add('active');
    }
    document.getElementById('headerSub').textContent = `${currentVenue}  —  ${currentDate}`;
    refreshAll();
  }

  window.onEventChange = applyEventSelection;

  // ──────────────────────────────────────────────
  // Venue
  // ──────────────────────────────────────────────
  window.selectVenue = function(v) {
    currentVenue = v;
    document.querySelectorAll('.venue-pill').forEach(b => b.classList.remove('active'));
    const slug = v === 'Tight End' ? 'te' : 'wc';
    document.querySelector(`.venue-pill.${slug}`)?.classList.add('active');
    document.getElementById('headerSub').textContent = `${currentVenue}  —  ${currentDate || '…'}`;
    refreshAll();
  };

  // ──────────────────────────────────────────────
  // Refresh
  // ──────────────────────────────────────────────
  window.refreshAll = async function() {
    if (!currentDate) return;
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    btn.textContent = '↻ …';
    try {
      await Promise.all([
        fetchDailyStats(),
        fetchScoring(1),
        fetchScoring(2)
      ]);
      document.getElementById('footerBar').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch(e) { console.error('refreshAll error:', e); }
    btn.classList.remove('spinning');
    btn.textContent = '↻ Refresh';

    // auto-refresh every 30s
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => window.refreshAll(), 30000);
  };

  async function fetchDailyStats() {
    try {
      dailyStats = await PokerAPI.getDailyStats({ date: currentDate, venue: currentVenue });
      renderCI();
      renderRSVP();
      renderStats();
    } catch(e) { console.error('getDailyStats error:', e); }
  }

  async function fetchScoring(gameNum) {
    try {
      const d = await PokerAPI.getLiveScoring({ date: currentDate, gameNum, venue: currentVenue });
      scoring[gameNum] = d;
      renderElims();
      renderBounties();
      renderStats();
      maybeShowResults();
    } catch(e) { console.error('getLiveScoring error:', e); }
  }

  function maybeShowResults() {
    const hasData =
      scoring[1].eliminations?.length > 0 ||
      scoring[2].eliminations?.length > 0 ||
      scoring[1].bounties?.length     > 0 ||
      scoring[2].bounties?.length     > 0;
    document.getElementById('resultsRow').style.display = hasData ? 'grid' : 'none';
  }

  // ──────────────────────────────────────────────
  // Stats bar
  // ──────────────────────────────────────────────
  function renderStats() {
    const g = activeStatsGame;
    const gd = dailyStats?.[`game${g}`];
    const sc = scoring[g];
    document.getElementById('statCI').textContent       = gd?.checkedIn?.length ?? '--';
    document.getElementById('statRSVP').textContent     = gd?.rsvpPending ?? '--';
    document.getElementById('statExpected').textContent = gd?.totalExpected ?? '--';
    document.getElementById('statElim').textContent     = sc?.eliminations?.length ?? '--';
  }

  window.switchStatsGame = function(g) {
    activeStatsGame = g;
    document.getElementById('sgTab1').classList.toggle('active', g === 1);
    document.getElementById('sgTab2').classList.toggle('active', g === 2);
    renderStats();
  };

  // ──────────────────────────────────────────────
  // Check-ins
  // ──────────────────────────────────────────────
  function renderCI() {
    const g1 = dailyStats?.game1?.checkedIn || [];
    const g2 = dailyStats?.game2?.checkedIn || [];
    document.getElementById('ciG1Count').textContent = g1.length;
    document.getElementById('ciG2Count').textContent = g2.length;
    document.getElementById('ciBadge').textContent   = g1.length + g2.length;
    const list = activeCiTab === 1 ? g1 : g2;
    const el   = document.getElementById('ciList');
    if (!list.length) { el.innerHTML = '<div class="empty-state">No check-ins yet</div>'; return; }
    el.innerHTML = list.map((p,i) => `
      <div class="player-row ci" onclick="removeCI('${esc(p.name)}', ${activeCiTab})">
        <span class="player-num">${i+1}</span>
        <span class="player-name">${p.name}</span>
        <span class="player-hint">tap to remove</span>
      </div>`).join('');
  }

  window.switchCiTab = function(g) {
    activeCiTab = g;
    document.getElementById('ciTab1').classList.toggle('active', g===1);
    document.getElementById('ciTab2').classList.toggle('active', g===2);
    renderCI();
  };

  window.removeCI = async function(name, gameNum) {
    if (!confirm(`Remove ${name} from Game ${gameNum}?`)) return;
    try {
      await PokerAPI.removeCheckin({ player: name, date: currentDate, gameNum, venue: currentVenue });
      fetchDailyStats();
    } catch(e) { alert('Error: ' + e.message); }
  };

  // ──────────────────────────────────────────────
  // RSVPs
  // ──────────────────────────────────────────────
  function renderRSVP() {
    const g1 = dailyStats?.game1?.rsvpList || [];
    const g2 = dailyStats?.game2?.rsvpList || [];
    const g1p = g1.filter(p => !p.arrived).length;
    const g2p = g2.filter(p => !p.arrived).length;
    document.getElementById('rsvpG1Count').textContent = `${g1p}/${g1.length}`;
    document.getElementById('rsvpG2Count').textContent = `${g2p}/${g2.length}`;
    document.getElementById('rsvpBadge').textContent   = g1p + g2p;

    const list = activeRsvpTab === 1 ? g1 : g2;
    const el   = document.getElementById('rsvpList');
    if (!list.length) { el.innerHTML = '<div class="empty-state">No RSVPs yet</div>'; return; }

    const sorted = [...list].sort((a,b) => (a.arrived?1:0) - (b.arrived?1:0));
    el.innerHTML = sorted.map((p,i) => `
      <div class="player-row rsvp ${p.arrived?'arrived':''}"
           onclick="${p.arrived ? '' : `ciFromRSVP('${esc(p.name)}', ${activeRsvpTab})`}">
        <span class="player-num">${i+1}</span>
        <span class="player-name">${p.name}</span>
        ${p.arrived
          ? '<span class="arrived-tag">✓ arrived</span>'
          : '<span class="player-hint">tap to check in</span>'}
      </div>`).join('');
  }

  window.switchRsvpTab = function(g) {
    activeRsvpTab = g;
    document.getElementById('rsvpTab1').classList.toggle('active', g===1);
    document.getElementById('rsvpTab2').classList.toggle('active', g===2);
    renderRSVP();
  };

  window.ciFromRSVP = async function(name, gameNum) {
    if (!confirm(`Check in ${name} for Game ${gameNum}?`)) return;
    try {
      const r = await PokerAPI.checkin({ player: name, date: currentDate, gameNum, venue: currentVenue });
      if (r.status === 'success' || r.status === 'duplicate') fetchDailyStats();
      else alert('Error: ' + (r.message || 'Check-in failed'));
    } catch(e) { alert('Error: ' + e.message); }
  };

  // ──────────────────────────────────────────────
  // Eliminations
  // ──────────────────────────────────────────────
  function renderElims() {
    const total = (scoring[1].eliminations?.length||0) + (scoring[2].eliminations?.length||0);
    document.getElementById('elimBadge').textContent = total;
    const elims = [...(scoring[activeElimTab].eliminations || [])].sort((a,b) => a.rank - b.rank);
    const el = document.getElementById('elimList');
    if (!elims.length) { el.innerHTML = '<div class="empty-state">No results yet</div>'; return; }
    el.innerHTML = elims.map(e => {
      const rankClass = e.rank===1 ? 'gold' : e.rank===2 ? 'silver' : e.rank===3 ? 'bronze' : '';
      const pts = BONUS_POINTS[e.rank] || 0;
      return `<div class="elim-row">
        <span class="rank-badge ${rankClass}">${e.rank}</span>
        <span class="player-name">${e.player}</span>
        ${pts ? `<span class="pts-tag">+${pts}</span>` : ''}
      </div>`;
    }).join('');
  }

  window.switchElimTab = function(g) {
    activeElimTab = g;
    document.getElementById('elimTab1').classList.toggle('active', g===1);
    document.getElementById('elimTab2').classList.toggle('active', g===2);
    renderElims();
  };

  // ──────────────────────────────────────────────
  // Bounties
  // ──────────────────────────────────────────────
  function renderBounties() {
    const b1total = scoring[1].bounties?.reduce((s,b)=>s+(b.count||0),0) || 0;
    const b2total = scoring[2].bounties?.reduce((s,b)=>s+(b.count||0),0) || 0;
    document.getElementById('bountyBadge').textContent = b1total + b2total;
    const bounties = [...(scoring[activeBountyTab].bounties || [])].sort((a,b)=>b.count-a.count);
    const el = document.getElementById('bountyList');
    if (!bounties.length) { el.innerHTML = '<div class="empty-state">No bounties yet</div>'; return; }
    el.innerHTML = bounties.map(b => `
      <div class="elim-row">
        <span class="player-name">${b.player}</span>
        <span class="bounty-tag">${b.count} ${b.count===1?'bounty':'bounties'}</span>
      </div>`).join('');
  }

  window.switchBountyTab = function(g) {
    activeBountyTab = g;
    document.getElementById('bountyTab1').classList.toggle('active', g===1);
    document.getElementById('bountyTab2').classList.toggle('active', g===2);
    renderBounties();
  };

  // ──────────────────────────────────────────────
  // Helpers
  // ──────────────────────────────────────────────
  function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

</script>
