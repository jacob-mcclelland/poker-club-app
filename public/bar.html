<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bar Orders - All-In Poker Club</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/img/favicon-staff.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: rgba(20,20,20,0.9);
      --border: rgba(255,255,255,0.09);
      --gold: #d4af37;
      --blue: #00aaff;
      --green: #00ff88;
      --red: #ff4444;
      --dim: #888;
      --text: #ffffff;
      --suit-hearts: #ff4d6d;
      --suit-diamonds: #ff8c42;
      --suit-clubs: #00d4aa;
      --suit-spades: #a78bfa;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background: radial-gradient(circle at top left, #1a0020 0%, #050505 55%);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + var(--safe-top)) 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .header-eyebrow { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
    .header-title { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    .header-context { font-size: 0.72rem; color: var(--gold); font-weight: 600; }

    .live-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green);
      flex-shrink: 0;
    }
    .live-dot::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Filter rows ── */
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 20px 0;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .seg {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      width: fit-content;
    }
    .seg-btn {
      background: none;
      border: none;
      border-radius: 7px;
      color: var(--dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      min-height: 44px;
      padding: 0 16px;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .seg-btn.active { background: rgba(255,255,255,0.13); color: var(--text); }
    .seg-btn .seg-count {
      background: rgba(212,175,55,0.3);
      color: var(--gold);
      border-radius: 20px;
      font-size: 0.68rem;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }
    .seg-btn:not(.active) .seg-count { background: rgba(255,255,255,0.1); color: var(--dim); }

    /* ── Tab view (suits) ── */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 14px 20px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .suit-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 8px 8px 0 0;
      color: var(--dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      min-height: 44px;
      padding: 0 18px;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .suit-tab[data-suit="hearts"].active   { border-color: var(--suit-hearts); color: var(--suit-hearts); }
    .suit-tab[data-suit="diamonds"].active { border-color: var(--suit-diamonds); color: var(--suit-diamonds); }
    .suit-tab[data-suit="clubs"].active    { border-color: var(--suit-clubs); color: var(--suit-clubs); }
    .suit-tab[data-suit="spades"].active   { border-color: var(--suit-spades); color: var(--suit-spades); }
    .tab-count {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      font-size: 0.7rem;
      padding: 1px 6px;
      min-width: 20px;
      text-align: center;
    }
    .suit-tab.active .tab-count { background: rgba(255,255,255,0.2); }

    /* ── New-order flash alerts ── */
    .suit-tab.tab-flash, .seg-btn.tab-flash { animation: tabFlash 0.85s ease-in-out infinite; }
    @keyframes tabFlash {
      0%, 100% { background: rgba(212,175,55,0); }
      50%      { background: rgba(212,175,55,0.28); }
    }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; padding: 16px 20px calc(20px + var(--safe-bottom)); }

    /* ── Order cards ── */
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .order-card.filled { opacity: 0.45; }
    .order-card.flash-new {
      border-color: var(--gold);
      animation: slideIn 0.3s ease, flashNew 0.9s ease-in-out 3;
    }
    @keyframes flashNew {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
      50%      { box-shadow: 0 0 20px 2px rgba(212,175,55,0.6); }
    }

    .order-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .order-head-left { display: flex; align-items: center; min-width: 0; }
    .order-table-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .order-table-badge[data-suit="hearts"]   { color: var(--suit-hearts); }
    .order-table-badge[data-suit="diamonds"] { color: var(--suit-diamonds); }
    .order-table-badge[data-suit="clubs"]    { color: var(--suit-clubs); }
    .order-table-badge[data-suit="spades"]   { color: var(--suit-spades); }
    .late-badge {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #000;
      background: var(--gold);
      border-radius: 5px;
      padding: 2px 7px;
      margin-left: 9px;
      flex-shrink: 0;
    }
    .order-time { font-size: 0.75rem; color: var(--dim); flex-shrink: 0; }

    .order-card-body { padding: 14px 16px; }
    .order-player-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 12px;
    }
    .order-player-row:last-child { border-bottom: none; }
    .op-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
    .order-player-name { font-weight: 700; font-size: 0.95rem; }
    .order-player-shots { font-size: 0.88rem; color: #ccc; text-align: right; flex-shrink: 0; }
    .order-player-note {
      font-size: 0.82rem; color: var(--gold); font-style: italic;
      padding: 1px 0 7px; border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.35;
    }

    .pay-tag {
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .pay-tag.card { color: var(--dim); border: 1px solid rgba(255,255,255,0.16); }
    .pay-tag.cash { color: #000; background: var(--green); }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(212,175,55,0.25);
      gap: 12px;
    }
    .order-total-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); flex-shrink: 0; }
    .order-total-text { font-size: 0.88rem; font-weight: 600; color: var(--gold); text-align: right; }

    .order-card-footer {
      padding: 8px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .order-submitter { font-size: 0.75rem; color: var(--dim); }
    .order-submitter strong { color: var(--blue); font-weight: 700; }

    .mark-filled-btn {
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 8px;
      color: var(--green);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      min-height: 44px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .mark-filled-btn:active { background: rgba(0,255,136,0.2); }
    .mark-filled-btn.filled {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      color: var(--dim);
      cursor: default;
    }

    /* ── "Still to pour" total (sticks to top while scrolling cards) ── */
    .pour-total {
      position: sticky; top: 0; z-index: 5;
      background: rgba(24,20,8,0.97);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 14px; padding: 13px 15px; margin-bottom: 14px;
    }
    .pour-total.done { background: rgba(255,255,255,0.04); border-color: var(--border); }
    .pour-total-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .pour-total.done .pour-total-head { margin-bottom: 0; }
    .pour-total-title { font-size: 0.68rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); }
    .pour-total.done .pour-total-title { color: var(--dim); }
    .pour-total-count { font-size: 1.3rem; font-weight: 800; color: var(--gold); white-space: nowrap; flex-shrink: 0; }
    .pour-total-count small { font-size: 0.62rem; color: var(--dim); font-weight: 700; letter-spacing: 0.5px; }
    .pour-done { font-size: 0.8rem; font-weight: 800; color: var(--green); }
    .pour-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pour-chip { background: rgba(212,175,55,0.14); border: 1px solid rgba(212,175,55,0.3); color: #fff; font-size: 0.85rem; font-weight: 700; padding: 5px 10px; border-radius: 8px; }
    .pour-chip b { color: var(--gold); }
    .pour-bytable { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 11px; padding-top: 10px; border-top: 1px solid rgba(212,175,55,0.2); }
    .pour-bytable .pt { font-size: 0.82rem; font-weight: 800; }

    /* ── EDITED badge + flash (an order changed after being sent) ── */
    .edited-badge {
      font-size: 0.58rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
      color: #000; background: var(--gold); border-radius: 5px; padding: 2px 7px; margin-left: 9px; flex-shrink: 0;
    }
    .order-card.edited { border-color: var(--gold); }

    /* ── Footer: submitter + progress tags + lifecycle actions ── */
    .order-card-footer { flex-direction: column; align-items: stretch; gap: 8px; }
    .order-foot-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .order-state-tags { display: flex; gap: 6px; flex-shrink: 0; }
    .state-tag {
      font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px;
      padding: 2px 7px; border-radius: 5px;
    }
    .state-tag.pour { color: var(--green); border: 1px solid rgba(0,255,136,0.4); }
    .state-tag.paid { color: var(--blue);  border: 1px solid rgba(0,170,255,0.4); }

    .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .act-btn {
      flex: 1 1 0; min-width: 84px; min-height: 46px;
      border-radius: 9px; cursor: pointer; font-family: inherit;
      font-size: 0.8rem; font-weight: 800; letter-spacing: 0.3px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .act-btn:disabled { opacity: 0.5; }
    .act-pour { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.4); color: var(--green); }
    .act-paid { background: rgba(0,170,255,0.12); border: 1px solid rgba(0,170,255,0.4); color: var(--blue); }
    .act-both { background: rgba(212,175,55,0.14); border: 1px solid rgba(212,175,55,0.45); color: var(--gold); }
    .act-btn:active { transform: scale(0.97); }
    .order-done-tag { color: var(--dim); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 10px 0; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-text { font-size: 0.9rem; }

    .hidden { display: none !important; }
    html.back-nav-on .header { padding-left: 68px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-eyebrow">All In Poker Club</div>
    <div class="header-title">Bar Orders</div>
    <div class="header-context" id="header-context"></div>
  </div>
  <div class="live-dot">Live</div>
</div>

<!-- Venue filter (only shown when >1 venue tonight) -->
<div class="filter-row hidden" id="venue-row">
  <div class="seg" id="venue-seg"></div>
</div>

<!-- Game segment -->
<div class="filter-row" id="game-row">
  <div class="seg" id="game-seg"></div>
</div>

<!-- View toggle -->
<div class="filter-row">
  <div class="seg">
    <button class="seg-btn active" id="tab-toggle-btn">By Table</button>
    <button class="seg-btn" id="card-toggle-btn">All Orders</button>
  </div>
</div>

<!-- Suit tab bar (tab view only) -->
<div class="tab-bar" id="tab-bar">
  <button class="suit-tab active" data-suit="hearts"><span>♥</span> Hearts <span class="tab-count" id="count-hearts">0</span></button>
  <button class="suit-tab" data-suit="diamonds"><span>♦</span> Diamonds <span class="tab-count" id="count-diamonds">0</span></button>
  <button class="suit-tab" data-suit="clubs"><span>♣</span> Clubs <span class="tab-count" id="count-clubs">0</span></button>
  <button class="suit-tab" data-suit="spades"><span>♠</span> Spades <span class="tab-count" id="count-spades">0</span></button>
</div>

<!-- Content -->
<div class="content" id="content"></div>

<script type="module">
  import { app, collection, query, where, orderBy, limit, onSnapshot, doc, setDoc, serverTimestamp, PokerSession } from './firebase-api.js?v=13';
  import { shotOrders } from './shot-orders.js?v=1';
  import { cleanOrder } from './shot-order-clean.js?v=1';

  // The tablet runs signed out; orders are read and marked poured/paid through
  // this device's anonymous account (the rules refuse signed-out writes).
  const { db: shotDb, ready: shotsReady } = shotOrders(app);

  // ── State ──────────────────────────────────────────────────────────────────
  let view = 'tab';              // 'tab' | 'card'
  let activeSuit = 'hearts';
  let allOrders = [];            // live from Firestore
  let tonightVenues = [];
  let selectedVenue = '';        // '' = all venues
  let ctxEventType = 'Regular';
  let selectedGame = 1;
  let gameManuallySet = false;
  let seenOrderIds = null;       // null until first snapshot (don't flash the backlog)
  let flashOrderIds = new Set(); // new, not-yet-looked-at orders → flash card + tab
  let today = PokerSession.todayStr();
  let unsubscribe = null;
  let editedOrderIds = new Set();   // sent orders whose contents changed → show EDITED
  let orderSignatures = new Map();  // id → content signature, to detect player edits

  // ── Order lifecycle (status + poured/paid flags; 'filled' = legacy poured) ──
  function orderPoured(o) { return !!(o && (o.poured || o.status === 'closed' || o.status === 'filled')); }
  function orderPaid(o)   { return !!(o && (o.paid   || o.status === 'closed')); }
  function orderClosed(o) { return !!(o && (o.status === 'closed' || o.status === 'filled')); }
  // Content signature for EDIT detection — derived from players (which fully
  // captures the order); we never read the stored `total` map (it deep-merges
  // on write and drifts, see orderTotals).
  function orderSig(o) {
    return (o.players || [])
      .map(p => `${p.name}:${p.payment}:${(p.shots || []).map(s => s.type + '×' + s.qty + (s.note ? '~' + s.note : '')).join('+')}`).join('|');
  }

  // A card's shot totals, derived from its players array (the source of truth).
  function orderTotals(o) {
    const t = {};
    (o.players || []).forEach(p => (p.shots || []).forEach(s => {
      const type = String(s.type || '').trim();
      if (!type) return;
      t[type] = (t[type] || 0) + (Number(s.qty) || 0);
    }));
    return t;
  }

  const SUIT_LABELS = {
    hearts:   { symbol: '♥', label: 'Hearts' },
    diamonds: { symbol: '♦', label: 'Diamonds' },
    clubs:    { symbol: '♣', label: 'Clubs' },
    spades:   { symbol: '♠', label: 'Spades' },
  };

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    selectedGame = PokerSession.currentGameNum();

    const { entries } = await PokerSession.getTonight();
    tonightVenues = Array.from(new Set(entries.map(e => e.venue).filter(Boolean)));
    if (tonightVenues.length >= 1) selectedVenue = tonightVenues[0];
    const entryForVenue = entries.find(e => e.venue === selectedVenue) || entries[0];
    ctxEventType = (entryForVenue && entryForVenue.eventType) || 'Regular';

    renderVenueFilter();
    renderHeaderContext();
    bindToggles();
    bindSuitTabs();
    startListener();
    startClockWatch();
  }

  // ── Firestore listener ─────────────────────────────────────────────────────
  function startListener() {
    if (unsubscribe) unsubscribe();
    // Fresh listen window → re-seed so the day's backlog counts as "seen".
    seenOrderIds = null;
    flashOrderIds = new Set();

    // Bound to today only — otherwise every order ever submitted is downloaded
    // to every bartender device on each change. Single field range + same-field
    // orderBy needs no composite index; the client datesMatch is a 2nd guard.
    const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
    const q = query(
      collection(shotDb, 'shotRounds'),
      where('timestamp', '>=', startOfDay),
      orderBy('timestamp', 'desc'),
      limit(200)
    );
    unsubscribe = onSnapshot(q, snap => {
      // 'draft' cards are still being built on the shots side — the bar only
      // sees orders once they're sent ('pending') or poured ('filled').
      // cleanOrder: one malformed card must not stop the whole board.
      const realDocs = snap.docs
        .map(d => ({ id: d.id, data: cleanOrder(d.data()) }))
        .filter(d => (d.data.status || 'pending') !== 'draft');

      const onVenue = (data) => !selectedVenue || (data.venue || '') === selectedVenue;

      if (seenOrderIds === null) {
        // First load: treat the existing backlog as already-seen (no flash) and
        // snapshot each order's content signature so later edits stand out.
        seenOrderIds = new Set(realDocs.map(d => d.id));
        realDocs.forEach(d => orderSignatures.set(d.id, orderSig(d.data)));
      } else {
        realDocs.forEach(d => {
          const data = d.data;
          if (!seenOrderIds.has(d.id)) {
            // Flash the first time an order becomes real to the bar — covers a
            // brand-new pending order AND a draft that was just submitted (its
            // first appearance here is as 'pending', not an 'added' change).
            seenOrderIds.add(d.id);
            orderSignatures.set(d.id, orderSig(data));
            if (onVenue(data)) flashOrderIds.add(d.id);
            return;
          }
          // Already seen → flag a content EDIT (shots/qty/payment changed) on a
          // still-open order so the bartender doesn't pour or ring the old version.
          const sig = orderSig(data);
          if (sig !== orderSignatures.get(d.id)) {
            orderSignatures.set(d.id, sig);
            if (!orderClosed(data) && onVenue(data)) { editedOrderIds.add(d.id); flashOrderIds.add(d.id); }
          }
        });
      }
      allOrders = realDocs.map(d => ({ id: d.id, ...d.data }));
      // Bound the tracking Sets/Map: drop any id no longer in the live window
      // (aged out, deleted, or stranded by a venue switch).
      const liveIds = new Set(allOrders.map(o => o.id));
      flashOrderIds.forEach(id => { if (!liveIds.has(id)) flashOrderIds.delete(id); });
      editedOrderIds.forEach(id => { if (!liveIds.has(id)) editedOrderIds.delete(id); });
      orderSignatures.forEach((_, id) => { if (!liveIds.has(id)) orderSignatures.delete(id); });
      renderGameSegment();
      renderContent();
    });
  }

  // ── Clock watch (game rolls over at the cutoff) ─────────────────────────────
  function startClockWatch() {
    setInterval(() => {
      // Local midnight rollover → rebuild the listener for the new day so the
      // query bound + datesMatch window stay current (and no flash strands).
      const nowDay = PokerSession.todayStr();
      if (nowDay !== today) {
        today = nowDay;
        startListener();
        renderHeaderContext();
      }
      const cur = PokerSession.currentGameNum();
      if (!gameManuallySet && cur !== selectedGame) {
        selectedGame = cur;
        renderGameSegment();
        renderContent();
      }
    }, 60000);
  }

  // ── Filtering helpers ──────────────────────────────────────────────────────
  function tonightVenueOrders() {
    return allOrders
      .filter(o => PokerSession.datesMatch(o.sessionDate || '', today))
      .filter(o => !selectedVenue || (o.venue || '') === selectedVenue);
  }

  function gameOrders() {
    return tonightVenueOrders().filter(o => (o.gameNum || 1) === selectedGame);
  }

  // Active first (newest first), then closed/done (newest first).
  function sortForDisplay(orders) {
    return orders.slice().sort((a, b) => {
      const af = orderClosed(a) ? 1 : 0;
      const bf = orderClosed(b) ? 1 : 0;
      if (af !== bf) return af - bf;
      return tsMillis(b) - tsMillis(a);
    });
  }

  function tsMillis(o) {
    const ts = o.timestamp;
    if (!ts) return 0;
    if (ts.toMillis) return ts.toMillis();
    if (ts.seconds) return ts.seconds * 1000;
    return 0;
  }

  // ── Venue filter ───────────────────────────────────────────────────────────
  function renderVenueFilter() {
    const row = document.getElementById('venue-row');
    if (tonightVenues.length <= 1) { row.classList.add('hidden'); return; }

    row.classList.remove('hidden');
    const seg = document.getElementById('venue-seg');
    seg.innerHTML = '';
    tonightVenues.forEach(v => {
      const b = document.createElement('button');
      b.className = 'seg-btn' + (v === selectedVenue ? ' active' : '');
      b.textContent = v;
      b.addEventListener('click', () => {
        selectedVenue = v;
        renderVenueFilter();
        renderHeaderContext();
        renderGameSegment();
        renderContent();
      });
      seg.appendChild(b);
    });
  }

  function renderHeaderContext() {
    const el = document.getElementById('header-context');
    const venue = selectedVenue || (tonightVenues.length ? tonightVenues.join(' / ') : 'All venues');
    el.textContent = `${venue} · ${today}`;
  }

  // ── Game segment ───────────────────────────────────────────────────────────
  function renderGameSegment() {
    const seg = document.getElementById('game-seg');
    seg.innerHTML = '';

    const base = tonightVenueOrders();
    const current = PokerSession.currentGameNum();

    // Always show the current game; show the other game only if it has orders
    // (keeps stale past-game clutter hidden).
    const counts = { 1: base.filter(o => (o.gameNum || 1) === 1).length,
                     2: base.filter(o => (o.gameNum || 1) === 2).length };
    const games = [];
    [1, 2].forEach(n => {
      if (n === current || counts[n] > 0 || n === selectedGame) games.push(n);
    });

    games.forEach(n => {
      const b = document.createElement('button');
      b.dataset.game = n;
      const hasFlash = base.some(o => (o.gameNum || 1) === n && flashOrderIds.has(o.id));
      b.className = 'seg-btn' + (n === selectedGame ? ' active' : '') + (hasFlash ? ' tab-flash' : '');
      const isCurrent = n === current;
      const pending = base.filter(o => (o.gameNum || 1) === n && !orderPoured(o)).length;
      b.innerHTML = `${PokerSession.gameLabel(n, ctxEventType)}${isCurrent ? ' • now' : ''}` +
                    (pending > 0 ? ` <span class="seg-count">${pending}</span>` : '');
      b.addEventListener('click', () => {
        selectedGame = n;
        // Latch off auto-rollover only when picking a game OTHER than the live
        // one; tapping the live game re-arms auto-follow.
        gameManuallySet = (n !== PokerSession.currentGameNum());
        renderGameSegment();
        renderContent();
      });
      seg.appendChild(b);
    });
  }

  // ── Tab counts + flash ─────────────────────────────────────────────────────
  function updateTabCountsAndFlash() {
    const game = gameOrders();
    const pending = game.filter(o => !orderPoured(o));
    ['hearts','diamonds','clubs','spades'].forEach(suit => {
      const el = document.getElementById('count-' + suit);
      const tab = document.querySelector('.suit-tab[data-suit="' + suit + '"]');
      const n = pending.filter(o => o.table === suit).length;
      if (el) {
        el.textContent = n;
        el.style.background = n > 0 ? 'rgba(212,175,55,0.3)' : 'rgba(255,255,255,0.1)';
        el.style.color = n > 0 ? '#d4af37' : '';
      }
      if (tab) {
        const hasFlash = game.some(o => o.table === suit && flashOrderIds.has(o.id));
        tab.classList.toggle('tab-flash', hasFlash);
      }
    });
    // Keep the game-segment flash in sync after acknowledgement.
    document.querySelectorAll('#game-seg .seg-btn').forEach(btn => {
      const n = Number(btn.dataset.game);
      const hasFlash = tonightVenueOrders().some(o => (o.gameNum || 1) === n && flashOrderIds.has(o.id));
      btn.classList.toggle('tab-flash', hasFlash);
    });
  }

  // ── "Still to pour" total ──────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function sumOrder(o) { return Object.values(orderTotals(o)).reduce((a, n) => a + (Number(n) || 0), 0); }
  function aggregateShots(orders) {
    const totals = {}; let count = 0;
    orders.forEach(o => Object.entries(orderTotals(o)).forEach(([t, q]) => { q = Number(q) || 0; totals[t] = (totals[t] || 0) + q; count += q; }));
    return { totals, count };
  }

  // A running pour list for the current scope (one table in By-Table view, all
  // tables in All-Orders view), counting ONLY unfilled cards — so marking a card
  // filled drops its shots out of the total instantly.
  function buildPourTotal(scopeOrders, isAllView) {
    const pending = scopeOrders.filter(o => !orderPoured(o));
    const el = document.createElement('div');
    el.className = 'pour-total';
    const scopeLabel = isAllView
      ? 'All tables'
      : `${SUIT_LABELS[activeSuit].symbol} ${SUIT_LABELS[activeSuit].label}`;

    if (!pending.length) {
      el.classList.add('done');
      el.innerHTML = `<div class="pour-total-head"><span class="pour-total-title">${scopeLabel} · to pour</span><span class="pour-done">All poured ✓</span></div>`;
      return el;
    }

    const { totals, count } = aggregateShots(pending);
    const chips = Object.entries(totals).sort((a, b) => b[1] - a[1])
      .map(([t, q]) => `<span class="pour-chip"><b>${q}×</b> ${escHtml(t)}</span>`).join('');

    let perTable = '';
    if (isAllView) {
      const parts = ['hearts', 'diamonds', 'clubs', 'spades'].map(s => {
        const c = pending.filter(o => o.table === s).reduce((a, o) => a + sumOrder(o), 0);
        return c ? `<span class="pt" style="color:var(--suit-${s})">${SUIT_LABELS[s].symbol} ${c}</span>` : '';
      }).filter(Boolean).join('');
      if (parts) perTable = `<div class="pour-bytable">${parts}</div>`;
    }

    el.innerHTML =
      `<div class="pour-total-head">
         <span class="pour-total-title">${scopeLabel} · still to pour</span>
         <span class="pour-total-count">${count} <small>shots · ${pending.length} ${pending.length === 1 ? 'card' : 'cards'}</small></span>
       </div>
       <div class="pour-chips">${chips}</div>${perTable}`;
    return el;
  }

  // ── Render content ─────────────────────────────────────────────────────────
  function renderContent() {
    const container = document.getElementById('content');
    container.innerHTML = '';

    const ctxOrders = gameOrders();

    // Earliest order per table (current game) → anything later is an "add-on".
    const firstByTable = {};
    ctxOrders.forEach(o => {
      const ms = tsMillis(o);
      if (firstByTable[o.table] === undefined || ms < firstByTable[o.table]) firstByTable[o.table] = ms;
    });

    let orders = ctxOrders;
    if (view === 'tab') orders = orders.filter(o => o.table === activeSuit);
    orders = sortForDisplay(orders);

    if (!orders.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🥃</div>
          <div class="empty-text">No orders yet${view === 'tab' ? ' for this table' : ''}.</div>
        </div>`;
      updateTabCountsAndFlash();
      return;
    }

    // Pour list on top: one table in By-Table view, all tables in All-Orders.
    container.appendChild(buildPourTotal(orders, view === 'card'));

    const acknowledged = [];
    orders.forEach(order => {
      const isLate = tsMillis(order) > (firstByTable[order.table] ?? 0);
      const isFlash = flashOrderIds.has(order.id);
      if (isFlash) acknowledged.push(order.id);
      container.appendChild(buildOrderCard(order, isLate, isFlash));
    });

    // These are now on screen → stop them flashing the tabs.
    acknowledged.forEach(id => flashOrderIds.delete(id));
    updateTabCountsAndFlash();
  }

  function buildOrderCard(order, isLate, isFlash) {
    const suit = SUIT_LABELS[order.table] || { symbol: '?', label: order.table || 'Unknown' };
    const isClosed = orderClosed(order);
    const isEdited = editedOrderIds.has(order.id);

    const card = document.createElement('div');
    card.className = 'order-card' + (isClosed ? ' filled' : '') + (isFlash ? ' flash-new' : '') + (isEdited ? ' edited' : '');

    // Header
    const header = document.createElement('div');
    header.className = 'order-card-header';
    const headLeft = document.createElement('div');
    headLeft.className = 'order-head-left';
    const badge = document.createElement('div');
    badge.className = 'order-table-badge';
    badge.dataset.suit = order.table || '';
    badge.innerHTML = `<span>${suit.symbol}</span> ${suit.label}`;
    headLeft.appendChild(badge);
    if (isLate) {
      const lb = document.createElement('span');
      lb.className = 'late-badge';
      lb.textContent = 'Add-on';
      headLeft.appendChild(lb);
    }
    if (isEdited) {
      const eb = document.createElement('span');
      eb.className = 'edited-badge';
      eb.textContent = 'Edited';
      headLeft.appendChild(eb);
    }
    const time = document.createElement('div');
    time.className = 'order-time';
    time.textContent = formatTime(order.timestamp);
    header.appendChild(headLeft);
    header.appendChild(time);
    card.appendChild(header);

    // Body — players (with Cash/Card tag each)
    const body = document.createElement('div');
    body.className = 'order-card-body';
    (order.players || []).forEach(player => {
      const row = document.createElement('div');
      row.className = 'order-player-row';

      const left = document.createElement('div');
      left.className = 'op-left';
      const nameEl = document.createElement('span');
      nameEl.className = 'order-player-name';
      nameEl.textContent = player.name;
      left.appendChild(nameEl);

      const pay = player.payment === 'cash' ? 'cash' : 'card';
      const payTag = document.createElement('span');
      payTag.className = 'pay-tag ' + pay;
      payTag.textContent = pay === 'cash' ? 'Cash' : 'Card';
      left.appendChild(payTag);

      const shotsEl = document.createElement('div');
      shotsEl.className = 'order-player-shots';
      shotsEl.textContent = (player.shots || [])
        .map(s => `${s.qty > 1 ? s.qty + '× ' : ''}${s.type}`).join(' + ');

      row.appendChild(left);
      row.appendChild(shotsEl);
      body.appendChild(row);
      (player.shots || []).forEach(s => {
        if (!s.note) return;
        const noteEl = document.createElement('div');
        noteEl.className = 'order-player-note';
        noteEl.textContent = `📝 ${s.type} — ${s.note}`;
        body.appendChild(noteEl);
      });
    });

    // Total (derived from players — never the stored map)
    const orderTot = orderTotals(order);
    if (Object.keys(orderTot).length) {
      const totalRow = document.createElement('div');
      totalRow.className = 'order-total-row';
      const totalLabel = document.createElement('div');
      totalLabel.className = 'order-total-label';
      totalLabel.textContent = 'Total';
      const totalText = document.createElement('div');
      totalText.className = 'order-total-text';
      totalText.textContent = Object.entries(orderTot)
        .map(([type, qty]) => `${qty > 1 ? qty + '× ' : ''}${type}`).join(', ');
      totalRow.appendChild(totalLabel);
      totalRow.appendChild(totalText);
      body.appendChild(totalRow);
    }
    card.appendChild(body);

    // Footer — submitter + progress tags + lifecycle actions
    const poured = orderPoured(order), paid = orderPaid(order), closed = orderClosed(order);
    const footer = document.createElement('div');
    footer.className = 'order-card-footer';

    const footTop = document.createElement('div');
    footTop.className = 'order-foot-top';
    const submitterEl = document.createElement('div');
    submitterEl.className = 'order-submitter';
    submitterEl.innerHTML = `Order by <strong></strong>`;
    submitterEl.querySelector('strong').textContent = order.submitter?.name || 'Unknown';
    footTop.appendChild(submitterEl);

    const tags = document.createElement('div');
    tags.className = 'order-state-tags';
    if (poured) tags.appendChild(stateTag('✓ Poured', 'pour'));
    if (paid) tags.appendChild(stateTag('✓ Paid', 'paid'));
    footTop.appendChild(tags);
    footer.appendChild(footTop);

    const actions = document.createElement('div');
    actions.className = 'order-actions';
    if (closed) {
      const done = document.createElement('span');
      done.className = 'order-done-tag';
      done.textContent = 'Closed ✓';
      actions.appendChild(done);
    } else {
      if (!poured) actions.appendChild(actionBtn('🍸 Pouring', 'pour', () => setPour(order.id)));
      if (!paid)   actions.appendChild(actionBtn('💲 Payment', 'paid', () => setPaid(order.id)));
      actions.appendChild(actionBtn('Both ✓', 'both', () => setBoth(order.id)));
    }
    footer.appendChild(actions);
    card.appendChild(footer);

    return card;
  }

  function stateTag(label, kind) {
    const t = document.createElement('span');
    t.className = 'state-tag ' + kind;
    t.textContent = label;
    return t;
  }

  function actionBtn(label, kind, onClick) {
    const b = document.createElement('button');
    b.className = 'act-btn act-' + kind;
    b.textContent = label;
    b.addEventListener('click', () => { b.disabled = true; onClick(); });
    return b;
  }

  // ── Lifecycle actions: Pouring (locks shots) · Payment (locks cash/card) ────
  async function setOrderState(orderId, patch) {
    editedOrderIds.delete(orderId);  // acting on an order acknowledges its edit flag
    flashOrderIds.delete(orderId);
    try {
      await shotsReady();
      await setDoc(doc(shotDb, 'shotRounds', orderId), patch, { merge: true });
      // onSnapshot re-renders automatically
    } catch (e) {
      console.error('Order update failed:', e);
      renderContent(); // restore the buttons on failure
    }
  }
  function setPour(orderId) {
    const o = allOrders.find(x => x.id === orderId) || {};
    setOrderState(orderId, { poured: true, pouredAt: serverTimestamp(), status: orderPaid(o) ? 'closed' : 'pending' });
  }
  function setPaid(orderId) {
    const o = allOrders.find(x => x.id === orderId) || {};
    setOrderState(orderId, { paid: true, paidAt: serverTimestamp(), status: orderPoured(o) ? 'closed' : 'pending' });
  }
  function setBoth(orderId) {
    setOrderState(orderId, { poured: true, paid: true, pouredAt: serverTimestamp(), paidAt: serverTimestamp(), status: 'closed' });
  }

  // ── Time format ────────────────────────────────────────────────────────────
  function formatTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date((ts.seconds || 0) * 1000);
    const h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'pm' : 'am';
    return `${h % 12 || 12}:${m} ${ampm}`;
  }

  // ── Toggles ────────────────────────────────────────────────────────────────
  function bindToggles() {
    document.getElementById('tab-toggle-btn').addEventListener('click', () => {
      view = 'tab';
      document.getElementById('tab-toggle-btn').classList.add('active');
      document.getElementById('card-toggle-btn').classList.remove('active');
      document.getElementById('tab-bar').classList.remove('hidden');
      renderContent();
    });
    document.getElementById('card-toggle-btn').addEventListener('click', () => {
      view = 'card';
      document.getElementById('card-toggle-btn').classList.add('active');
      document.getElementById('tab-toggle-btn').classList.remove('active');
      document.getElementById('tab-bar').classList.add('hidden');
      renderContent();
    });
  }

  function bindSuitTabs() {
    document.querySelectorAll('.suit-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.suit-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeSuit = tab.dataset.suit;
        renderContent();
      });
    });
  }

  init();
</script>
