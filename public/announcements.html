<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Feed - All-In Poker Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #050505;
      --card-bg: rgba(20, 20, 20, 0.6);
      --accent-gold: #d4af37;
      --text-main: #fff;
      --text-muted: #aaa;
      --border: rgba(255, 255, 255, 0.08);
      --glass-shine: rgba(255, 255, 255, 0.03);
      --blue: #00aaff;
      --green: #00ff88;
      --red: #ff4444;
    }
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 0%, #1a1a2a 0%, #050505 100%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }

    .header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); transform: translateX(-2px); }
    .header-title {
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
    }
    .header-icon { color: var(--accent-gold); opacity: 0.8; }

    .feed-container {
      flex: 1;
      max-width: 550px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    .news-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .news-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-shine), transparent);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .news-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .poster-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #222, #000);
      border: 1px solid var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(212,175,55,0.2);
    }
    .poster-info { flex: 1; }
    .poster-name { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
    .verified-check { color: var(--blue); width: 14px; height: 14px; }
    .news-date { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

    .news-type-tag {
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .type-info { color: var(--blue); border-color: rgba(0,170,255,0.3); }
    .type-success { color: var(--green); border-color: rgba(0,255,136,0.3); }
    .type-warning { color: var(--accent-gold); border-color: rgba(212,175,55,0.3); }
    .type-error { color: var(--red); border-color: rgba(255,68,68,0.3); }

    .news-headline {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.25;
      background: linear-gradient(to bottom, #fff, #bbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .news-content {
      color: #ccc;
      font-size: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .news-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 16px;
      display: block;
    }
    .news-link-preview {
      display: block;
      margin: 16px 0;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: inherit;
    }
    .news-link-preview:hover {
      border-color: rgba(212,175,55,0.28);
      background: rgba(255,255,255,0.05);
    }
    .preview-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.04);
    }
    .preview-body {
      padding: 14px 16px 16px;
    }
    .preview-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .preview-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #f3f3f3;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .preview-description {
      font-size: 0.88rem;
      line-height: 1.5;
      color: #b9b9b9;
      margin-bottom: 10px;
    }
    .preview-domain {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
    }
    .news-link-fallback {
      display: inline-flex;
      margin-top: 14px;
      color: var(--blue);
      font-size: 0.92rem;
      text-decoration: none;
      word-break: break-all;
    }
    .news-link-fallback:hover { text-decoration: underline; }

    /* ── Embedded Event Card ── */
    .linked-event-card {
      display: block;
      margin-top: 18px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.25);
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .linked-event-card.clickable:hover {
      transform: translateY(-3px);
      border-color: var(--accent-gold);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 16px rgba(212,175,55,0.15);
    }
    .lec-header {
      padding: 8px 14px;
      border-bottom: 1px solid rgba(212,175,55,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lec-date {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .lec-meta {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .lec-img {
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lec-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lec-body {
      padding: 10px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .lec-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.3;
    }
    .lec-theme {
      font-size: 0.62rem;
      font-weight: 700;
      color: #0096ff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
    }
    .lec-cta {
      flex-shrink: 0;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .spinner {
      margin: 60px auto;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(212, 175, 55, 0.1);
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <button class="back-btn" data-back-nav onclick="window.BackNav ? BackNav.go() : history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="header-title">League Feed</div>
    </div>
    <div class="header-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    </div>
  </div>

  <div class="feed-container">
    <div id="feedContent">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module">
    import { PokerAPI } from './firebase-api.js?v=7';

    function renderLinkedEvent(post, scheduleByDate) {
      const dateKey = post.linkedEventDate;
      if (!dateKey) return '';
      const ev = scheduleByDate[dateKey];
      if (!ev) return '';

      const dt = new Date(ev.date);
      dt.setHours(12, 0, 0, 0);
      const dayStr = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const gameType = ev.type?.toLowerCase().includes('championship') ? '🏆 Championship' : '♠ Regular Season';
      const href = ev.facebookEventUrl ? `href="${escapeHtml(ev.facebookEventUrl)}" target="_blank" rel="noopener"` : '';
      const clickable = ev.facebookEventUrl ? 'clickable' : '';
      const ctaHtml = ev.facebookEventUrl
        ? `<span class="lec-cta">View on Facebook <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>`
        : '';

      return `
        <a ${href} class="linked-event-card ${clickable}">
          <div class="lec-header">
            <div class="lec-date">${escapeHtml(dayStr)}</div>
            <div class="lec-meta">${escapeHtml(ev.location || '')} &nbsp;·&nbsp; ${gameType}</div>
          </div>
          <div class="lec-img">
            ${ev.image ? `<img src="${escapeHtml(ev.image)}" alt="${escapeHtml(ev.title || '')}" loading="lazy">` : '🃏'}
          </div>
          <div class="lec-body">
            <div>
              <div class="lec-title">${escapeHtml(ev.title || 'Game Night')}</div>
              ${ev.theme ? `<div class="lec-theme">Theme: ${escapeHtml(ev.theme)}</div>` : ''}
            </div>
            ${ctaHtml}
          </div>
        </a>
      `;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderLinkPreview(post) {
      const sourceUrl = post.sourceUrl || post.linkPreview?.sourceUrl;
      if (!sourceUrl) return '';

      const preview = post.linkPreview || {};
      const title = preview.title || sourceUrl;
      const description = preview.description || '';
      const domain = preview.siteName || preview.domain || (() => {
        try { return new URL(sourceUrl).hostname.replace(/^www\./i, ''); }
        catch { return sourceUrl; }
      })();

      if (preview.title || preview.description || preview.imageUrl) {
        return `
          <a class="news-link-preview" href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">
            ${preview.imageUrl ? `<img class="preview-image" src="${escapeHtml(preview.imageUrl)}" alt="${escapeHtml(title)}" loading="lazy">` : ''}
            <div class="preview-body">
              <div class="preview-label">Linked Post</div>
              <div class="preview-title">${escapeHtml(title)}</div>
              ${description ? `<div class="preview-description">${escapeHtml(description)}</div>` : ''}
              <div class="preview-domain">${escapeHtml(domain)}</div>
            </div>
          </a>
        `;
      }

      return `<a class="news-link-fallback" href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceUrl)}</a>`;
    }

    async function loadFeed() {
      const feedEl = document.getElementById('feedContent');
      try {
        const [posts, { schedule }] = await Promise.all([
          PokerAPI.getAnnouncements(20),
          PokerAPI.getSchedule({ all: true })
        ]);

        const scheduleByDate = {};
        (schedule || []).forEach(ev => {
          if (!ev.date) return;
          // Normalize M/D/YYYY → YYYY-MM-DD for consistent lookup
          const parts = ev.date.split('/');
          const key = parts.length === 3
            ? `${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`
            : ev.date;
          scheduleByDate[key] = ev;
        });

        if (!posts.length) {
          feedEl.innerHTML = '<div class="empty-state">No announcements yet. Check back soon for league updates!</div>';
          return;
        }

        let html = '';
        posts.forEach(post => {
          const dt = post.createdAt ? new Date(post.createdAt.seconds * 1000) : new Date();
          const dateStr = dt.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
          });

          html += `
            <div class="news-card">
              <div class="news-header">
                <div class="poster-avatar">&#9824;</div>
                <div class="poster-info">
                  <div class="poster-name">
                    All-In Poker Club
                    <svg class="verified-check" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                  </div>
                  <div class="news-date">${escapeHtml(dateStr)} &bull; <span class="news-type-tag type-${escapeHtml(post.type || 'info')}">${escapeHtml(post.type || 'update')}</span></div>
                </div>
              </div>

              <div class="news-headline">${escapeHtml(post.title)}</div>
              ${post.imageUrl ? `<img class="news-image" src="${escapeHtml(post.imageUrl)}" alt="${escapeHtml(post.title)}" loading="lazy">` : ''}
              <div class="news-content">${escapeHtml(post.content)}</div>
              ${renderLinkedEvent(post, scheduleByDate)}
              ${renderLinkPreview(post)}
            </div>
          `;
        });
        feedEl.innerHTML = html;
      } catch (e) {
        feedEl.innerHTML = '<div class="empty-state">Failed to load news feed.</div>';
      }
    }

    loadFeed();
  </script>
  <script src="/update-check.js"></script>
  <!-- Round timer button (bottom-left) while a venue clock runs tonight; same as index.html -->
  <script type="module" src="./clock-fab.js?v=3"></script>
  <script src="/back-nav.js?v=1" data-home="/"></script>
</body>
</html>
